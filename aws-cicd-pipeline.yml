AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS CodePipeline and CodeBuild CI/CD Pipeline for React Expense Tracker deploying to S3'

Parameters:
  ProjectName:
    Type: String
    Default: expense-tracker
    Description: Base name for the project resources

  GitHubRepoOwner:
    Type: String
    Default: TejuGabbu
    Description: GitHub username or organization name that owns the repository

  GitHubRepoName:
    Type: String
    Default: Expense_Tracker
    Description: GitHub repository name

  GitHubBranch:
    Type: String
    Default: master
    Description: Branch to monitor for continuous deployment

  TargetS3Bucket:
    Type: String
    Default: luv-kush
    Description: S3 bucket name configured for static website hosting where build artifacts will be deployed

  CodeStarConnectionArn:
    Type: String
    Description: The ARN of the AWS CodeStar Connection to GitHub (Created via AWS Console > CodePipeline > Settings > Connections)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "GitHub Source Settings"
        Parameters:
          - GitHubRepoOwner
          - GitHubRepoName
          - GitHubBranch
          - CodeStarConnectionArn
      - Label:
          default: "Deployment Target Settings"
        Parameters:
          - TargetS3Bucket
          - ProjectName

Resources:
  # ----------------------------------------------------------------------
  # S3 Bucket for Staging Pipeline Artifacts
  # ----------------------------------------------------------------------
  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-codepipeline-artifacts-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ----------------------------------------------------------------------
  # IAM Role for AWS CodeBuild
  # ----------------------------------------------------------------------
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: CodeBuildBasePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "${PipelineArtifactBucket.Arn}/*"
                  - !GetAtt PipelineArtifactBucket.Arn

  # ----------------------------------------------------------------------
  # AWS CodeBuild Project
  # ----------------------------------------------------------------------
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-build"
      Description: Builds the React Expense Tracker application using Node.js
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: CI
            Value: "false"
          - Name: NODE_OPTIONS
            Value: "--openssl-legacy-provider"
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      TimeoutInMinutes: 15
      Cache:
        Type: S3
        Location: !Sub "${PipelineArtifactBucket}/build-cache"

  # ----------------------------------------------------------------------
  # IAM Role for AWS CodePipeline
  # ----------------------------------------------------------------------
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codepipeline-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: CodePipelineServicePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref CodeStarConnectionArn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:PutObjectAcl
                Resource:
                  - !Sub "${PipelineArtifactBucket.Arn}/*"
                  - !GetAtt PipelineArtifactBucket.Arn
                  - !Sub "arn:aws:s3:::${TargetS3Bucket}/*"
                  - !Sub "arn:aws:s3:::${TargetS3Bucket}"
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt CodeBuildProject.Arn

  # ----------------------------------------------------------------------
  # AWS CodePipeline Definition
  # ----------------------------------------------------------------------
  ExpenseTrackerPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-pipeline"
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
      Stages:
        # Stage 1: Pull code from GitHub
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Sub "${GitHubRepoOwner}/${GitHubRepoName}"
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceOutput
              RunOrder: 1

        # Stage 2: Build React SPA
        - Name: Build
          Actions:
            - Name: BuildApp
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1

        # Stage 3: Deploy artifacts to Target S3 Website Bucket
        - Name: Deploy
          Actions:
            - Name: DeployToS3Website
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: S3
                Version: '1'
              Configuration:
                BucketName: !Ref TargetS3Bucket
                Extract: 'true'
              InputArtifacts:
                - Name: BuildOutput
              RunOrder: 1

Outputs:
  PipelineName:
    Description: Name of the AWS CodePipeline
    Value: !Ref ExpenseTrackerPipeline

  PipelineConsoleUrl:
    Description: Direct URL to the CodePipeline in AWS Console
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${ExpenseTrackerPipeline}/view"

  StaticWebsiteUrl:
    Description: URL to access the deployed Expense Tracker React Application
    Value: !Sub "http://${TargetS3Bucket}.s3-website.${AWS::Region}.amazonaws.com"
